# Publica la versión FastAPI + Vue en Hugging Face Spaces en cada push a main que toque la app web.
# Requiere HF_TOKEN y SIRAP_DATA_GITHUB_TOKEN (token con acceso de lectura/escritura al repo privado de datos).
name: Deploy a Hugging Face Spaces

on:
  push:
    branches: [main]
    paths: ["api/**", "src/**", "frontend/**", "config/**", "data/**", "models/**", "results/metrics/**",
            "data/samples/**", "requirements.txt", "Dockerfile", "deploy/huggingface/**",
            ".github/workflows/deploy-hf-space.yml"]
  workflow_dispatch:

concurrency: { group: hf-space, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "huggingface_hub>=0.25"
      - name: Subir al Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          SIRAP_JWT_SECRET: ${{ secrets.SIRAP_JWT_SECRET }}
          SIRAP_DEMO_PASSWORD: ${{ secrets.SIRAP_DEMO_PASSWORD }}
          SIRAP_DATA_GITHUB_TOKEN: ${{ secrets.SIRAP_DATA_GITHUB_TOKEN }}
          SIRAP_DATA_GITHUB_REPO: eduardoceballos666/SIRAP_datos_privados
        run: python deploy/huggingface/sync_space.py
